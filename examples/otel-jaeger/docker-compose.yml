name: breakwater-otel-demo

services:
  app:
    build: ./app
    ports:
      - '8080:8080' # stats() as JSON
      - '9464:9464' # OTel metrics in Prometheus exposition format
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.8.0
    ports:
      - '16686:16686' # UI — the traces live here
      # 4318 (OTLP/HTTP) stays internal: only the app talks to it.

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
