name: breakwater-demo

services:
  app:
    build: ./app
    ports:
      - '8080:8080'

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # Demo-only: walk straight into the dashboard, no login.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # The single source of truth for the dashboard is the importable JSON
      # one directory up — provisioned here, never duplicated.
      - ../grafana/breakwater-dashboard.json:/etc/breakwater/breakwater-dashboard.json:ro
    # Provisioning skips Grafana's import flow, which is what resolves the
    # ${DS_PROMETHEUS} placeholder — so resolve it ourselves against the
    # provisioned datasource uid, then hand off to the stock entrypoint.
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /var/lib/grafana/dashboards
        sed 's/$${DS_PROMETHEUS}/prometheus/g' /etc/breakwater/breakwater-dashboard.json > /var/lib/grafana/dashboards/breakwater.json
        exec /run.sh
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
