name: Publish package
on:
  push:
    branches:
      - main
permissions:
  contents: write
  # Required for OIDC trusted publishing: npm exchanges the workflow's
  # identity token for a short-lived credential — no NPM_TOKEN secret.
  id-token: write
# Serialize releases: concurrent pushes to main must not race each other
# through version bump / publish / tag push.
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish-npm:
    name: Publish package on npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) requires npm >= 11.5.1; the runner's
      # bundled npm may lag behind, so upgrade explicitly.
      - name: Update npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
      - name: Configure git
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Install dependencies
        run: |
          npm install
      - name: Lint and unit tests
        run: |
          npm run lint
          npm test
      - name: Bump version based on commit message
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Last commit message: $COMMIT_MSG"

          # The npm registry is the source of truth for what is already
          # published: basing the bump on package.json/tags desyncs whenever
          # a previous run publishes but fails a later step.
          PKG_NAME=$(node -p "require('./package.json').name")
          PUBLISHED_VERSION=$(npm view "$PKG_NAME" version 2>/dev/null || true)

          if [[ -z "$PUBLISHED_VERSION" ]]; then
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "Package not on the registry yet. Using package.json version: $NEW_VERSION"
          else
            echo "Latest published version: $PUBLISHED_VERSION"
            npm version "$PUBLISHED_VERSION" --no-git-tag-version --allow-same-version

            if [[ $COMMIT_MSG == *"BREAKING CHANGE"* || $COMMIT_MSG == *"major"* ]]; then
              echo "Major version bump"
              NEW_VERSION=$(npm version major --no-git-tag-version)
            elif [[ $COMMIT_MSG == *"minor"* ]]; then
              echo "Minor version bump"
              NEW_VERSION=$(npm version minor --no-git-tag-version)
            else
              echo "Patch version bump"
              NEW_VERSION=$(npm version patch --no-git-tag-version)
            fi
            NEW_VERSION=${NEW_VERSION#v}
          fi

          echo "Version to be used: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV
      - name: Build project
        run: |
          npm run build
      - name: Generate changelog
        run: |
          parse_date () {
            git log -1 --pretty=format:'%ad' --date=short "$1"
          }
          create_tag () {
            git tag "$1"
          }
          get_package_version () {
            node -p "require('./package.json').version"
          }

          new_version="$(get_package_version)"

          if [[ -f CHANGELOG.md ]]; then
            existing_changelog=$(sed '1d' CHANGELOG.md)
          else
            existing_changelog=""
          fi

          changelog_content="# CHANGELOG\n\n"

          if [[ -z $(git tag | tail -1) ]]; then
            first_tag="$new_version"
            create_tag "$first_tag"
            tag_date=$(parse_date "${first_tag}")
            changelog_content+="## ${first_tag} (${tag_date})\n\n"
            changelog_content+=$(git log --pretty=format:"* %s by %an [View](https://github.com/${GITHUB_REPOSITORY}/commit/%H)" --reverse | grep -v 'Merge\|skip]')
            changelog_content+="\n\n"
          else
            previous_tag=$(git describe --tags --abbrev=0)
            create_tag "$new_version"
            changelog_content+="## ${new_version} ($(date +'%Y-%m-%d'))\n\n"
            changelog_content+=$(git log ${previous_tag}..HEAD --pretty=format:"* %s by %an [View](https://github.com/${GITHUB_REPOSITORY}/commit/%H)" --reverse | grep -v 'Merge\|skip]')
            changelog_content+="\n\n"
          fi

          echo -e "${changelog_content}${existing_changelog}" > CHANGELOG.md
      # Authentication happens via OIDC trusted publishing (id-token: write
      # + the trusted publisher configured on npmjs.com) — no token secret.
      # Provenance attestation is generated automatically.
      - name: Publish package to npm
        run: |
          npm publish --access public
      - name: Create and push tag
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin "v$NEW_VERSION"
      # Reuses the version section just written to CHANGELOG.md as the release
      # body. For milestone releases, edit the release afterwards with curated
      # notes — this step never overwrites an existing release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")

          awk "/^## ${NEW_VERSION} /{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > /tmp/release-notes.md

          if gh release view "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Release v$NEW_VERSION already exists, skipping"
          else
            gh release create "v$NEW_VERSION" --title "v$NEW_VERSION" --notes-file /tmp/release-notes.md
          fi
      - name: Commit package files
        run: |
          git add package.json CHANGELOG.md

          git diff --quiet && git diff --staged --quiet || (
            git commit -m "[ci skip]: update package files and changelog" --no-verify
          )

          git push origin HEAD
